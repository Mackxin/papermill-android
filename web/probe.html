<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>布局探针</title>
<style>
  body { margin: 0; font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; }
  #report { padding: 10px 12px; background: #fff; white-space: pre-wrap; }
  #app { width: 430px; height: 900px; border: 0; display: block; }
</style>
</head>
<body>
<pre id="report">测量中…</pre>
<iframe id="app" src="index.html"></iframe>
<script type="module">
/** 横向溢出探针：谁把页面撑宽了，一眼看出来 */
const frame = document.getElementById('app');
const report = document.getElementById('report');
const out = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ?h=preview 就按那个深链打开，方便探预览页
const deep = new URLSearchParams(location.search).get('h');
if (deep) frame.src = `index.html#${deep}`;

await new Promise((r) => { frame.onload = r; });
await sleep(1200);

const D = frame.contentDocument;
const W = frame.contentWindow;
const vw = W.innerWidth;
out.push(`视口 ${vw}px · 文档 scrollWidth ${D.scrollingElement.scrollWidth}px`);
out.push('');

// 逐个元素比对右边界，找出越过视口的
const over = [];
D.querySelectorAll('body *').forEach((el) => {
  const r = el.getBoundingClientRect();
  if (r.width === 0) return;
  if (r.right > vw + 0.5) {
    over.push({
      tag: el.tagName.toLowerCase(),
      cls: el.className && typeof el.className === 'string' ? '.' + el.className.split(' ').filter(Boolean).join('.') : '',
      right: Math.round(r.right),
      w: Math.round(r.width),
    });
  }
});
// 只留最外层（父节点没越界的那些），噪音少
const trimmed = over.filter((o, i) => i < 40);
out.push(`越界元素 ${over.length} 个（前 40）：`);
trimmed.forEach((o) => out.push(`  ${o.tag}${o.cls}  right=${o.right}  w=${o.w}`));

report.textContent = out.join('\n');

// 顺手把几个关键控件的真实盒子打出来，判断有没有被裁掉
const box = (sel) => {
  const el = D.querySelector(sel);
  if (!el) return `${sel} 不存在`;
  const r = el.getBoundingClientRect();
  return `${sel}  left=${Math.round(r.left)} right=${Math.round(r.right)} w=${Math.round(r.width)} h=${Math.round(r.height)}`;
};
report.textContent += '\n\n' + [
  box('#view .card'),
  box('#view .type-item'),
  box('#view .type-item .num'),
  box('#view .type-name'),
  box('.dock'),
  box('.create-actions'),
].join('\n');
window.__done = true;
</script>
</body>
</html>
