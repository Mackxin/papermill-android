<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>端到端自检</title>
<style>
  body { margin: 0; padding: 12px; background: #f6f5fa; font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; }
  #report { margin: 0 0 12px; padding: 10px 12px; background: #fff; border-radius: 8px;
            white-space: pre-wrap; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  #app { width: 1180px; height: 860px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<pre id="report">运行中…</pre>
<iframe id="app"></iframe>
<script type="module">
/**
 * 端到端自检：把「出卷 → 排版 → 批改 → 错题本 → 试卷库 → 学生 → 自编题 → 打印纸 → 课本」
 * 整条链路真的点一遍，用 iframe 加载真实页面、真实点按钮。
 *
 * 为什么不写单元测试：这里要验的恰恰是「连起来还对不对」——按钮点得动、DOM 出得来、
 * 数据存得下、刷新还在。拆成函数级单测反而测不到这些。
 *
 * 为了不弄脏用户数据：开工前把 localStorage 里的那份存档拿出备份、清空，跑完再放回去。
 */

const KEY = 'papermill.web.v2';
const backup = localStorage.getItem(KEY);
localStorage.removeItem(KEY);

const frame = document.getElementById('app');
const report = document.getElementById('report');
const rows = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const D = () => frame.contentDocument;
const q = (sel) => D().querySelector(sel);
const qa = (sel) => [...D().querySelectorAll(sel)];
const T = (n) => (n ? n.textContent.replace(/\s+/g, ' ').trim() : '');

function paint() {
  const pass = rows.filter((r) => r[0] === '✅').length;
  report.textContent = `端到端自检 ${pass}/${rows.length}\n\n`
    + rows.map(([m, name, detail]) => `${m} ${name}${detail ? ` — ${detail}` : ''}`).join('\n');
  document.title = `E2E ${pass}/${rows.length}`;
}

async function test(name, fn) {
  try {
    const detail = await fn();
    rows.push(['✅', name, detail ?? '']);
  } catch (err) {
    rows.push(['❌', name, err.message]);
  }
  paint();
}

// 任何逃出 test() 的异常都要留下来 —— 否则页面就停在那句「运行中…」，
// 看不出到底是哪一步炸的（这个坑踩过一次）
window.addEventListener('error', (e) => {
  rows.push(['💥', '脚本异常', e.message]);
  paint();
});
window.addEventListener('unhandledrejection', (e) => {
  rows.push(['💥', '未捕获的 Promise 错误', String(e.reason?.message ?? e.reason)]);
  paint();
});

async function waitFor(fn, label, ms = 9000) {
  const t0 = Date.now();
  for (;;) {
    let v = null;
    try { v = fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() - t0 > ms) throw new Error(`等不到「${label}」`);
    await sleep(50);
  }
}

// ---------------------------------------------------------------- 操作小工具

function dock(label) {
  const b = qa('.dock .dock-btn').find((x) => T(x) === label);
  if (!b) throw new Error(`导航里没有「${label}」`);
  b.click();
}
function findField(root, label) {
  return [...root.querySelectorAll('.field')].find((f) => T(f.querySelector(':scope > span')) === label);
}
function chipIn(root, label, text) {
  const f = findField(root, label);
  if (!f) throw new Error(`没有「${label}」这一项`);
  const c = [...f.querySelectorAll('.chip')].find((x) => T(x) === text);
  if (!c) throw new Error(`「${label}」下没有「${text}」`);
  return c;
}
const viewChip = (label, text) => chipIn(q('#view'), label, text);
function setControl(el, v) {
  if (el.tagName === 'SELECT') { el.value = String(v); el.dispatchEvent(new Event('change', { bubbles: true })); return; }
  el.value = v;
  // 页面上有的控件挂在 oninput、有的挂在 onchange，两个都发一遍最稳
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}
function setFieldInput(root, label, v) {
  const f = findField(root, label);
  if (!f) throw new Error(`没有「${label}」输入框`);
  setControl(f.querySelector('input, select, textarea'), v);
}
const modal = () => q('.modal-mask .modal-card');
const modalBtn = (text) => [...modal().querySelectorAll('.modal-foot .btn')].find((b) => T(b) === text);
function closeModal() { const x = q('.modal-mask .icon-btn'); if (x) x.click(); }

/** 从出卷页生成一张卷子，再把关键指标收集起来 */
async function generate() {
  const b = q('#view .create-actions .btn.primary');
  if (!b) throw new Error('当前不在出卷页');
  b.click();
  await waitFor(() => qa('#view .paper-stage .paper-page').length > 0, '卷子排出来');
  await sleep(180);
  return collect();
}
function collect() {
  const pages = qa('#view .paper-stage .paper-page');
  const desc = T(q('#view .preview-toolbar .grow'));
  return { n: pages.length, desc, text: pages.map((p) => T(p)).join('\n'), pages };
}
function goCreate() {
  const back = qa('#view .preview-toolbar .btn').find((b) => T(b) === '← 返回');
  if (back) back.click();
  else dock('出卷');
}

// ---------------------------------------------------------------- 开跑

frame.src = 'index.html';
try {
  await new Promise((r, j) => {
    frame.onload = r;
    setTimeout(() => j(new Error('iframe 加载超时')), 15000);
  });
  await waitFor(() => q('#view .type-list'), '出卷页渲染完', 15000);
} catch (err) {
  let seen = '';
  try { seen = T(q('#view')) || T(D().body).slice(0, 300); } catch { seen = '(读不到 iframe)'; }
  rows.push(['❌', '页面启动', `${err.message}｜iframe 里看到：${seen.slice(0, 300)}`]);
  paint();
  throw err;
}
await sleep(400); // 让 boot 里那张垫底卷子排完

// 1 ---------------------------------------------------------------
await test('出卷页 · 题型 / 模板 / 卷面定制', () => {
  const types = qa('#view .type-item').length;
  const tpls = qa('#view .template-chip').length;
  const heads = qa('#view .card h2').map(T);
  const need = ['出什么卷', '卷面定制'];
  if (types < 10) throw new Error(`题型只有 ${types} 个`);
  // 模板是按年级 + 科目筛过的，低年级数学只出得来 7 个，不能写死 12
  if (tpls < 5) throw new Error(`快捷模板只有 ${tpls} 个`);
  const miss = need.filter((h) => !heads.some((x) => x.startsWith(h)));
  if (miss.length) throw new Error('缺卡片：' + miss.join('、'));
  return `${types} 个题型 · ${tpls} 个模板 · ${heads.length} 张卡`;
});

// 2 ---------------------------------------------------------------
await test('卷型 · 11 个类型都在，点「期末测试」标题与题型数一起变', async () => {
  const f = findField(q('#view'), '卷型');
  if (!f) throw new Error('出卷页没有「卷型」这一项');
  const labels = [...f.querySelectorAll('.chip')].map(T);
  const need = ['全部', '单元测试', '期中测试', '期末测试', '练习题', '拼音', '复习题', '综合测试', '竞赛', '奥数', '小升初'];
  if (labels.length !== need.length) throw new Error(`卷型有 ${labels.length} 个：${labels.join('/')}`);
  const miss = need.filter((x) => !labels.includes(x));
  if (miss.length) throw new Error('缺卷型：' + miss.join('、'));
  viewChip('卷型', '期末测试').click();
  await sleep(150);
  const paper = await generate();
  if (!/期末测试/.test(paper.text)) throw new Error('卷头没印「期末测试」：' + paper.text.slice(0, 60));
  const sections = (paper.text.match(/（每题 \d+ 分/g) ?? []).length;
  if (sections < 5) throw new Error(`期末测试只排了 ${sections} 个大题，应该有 5 个`);
  return `11 个卷型 · 期末测试 ${sections} 个大题`;
});

// 3 ---------------------------------------------------------------
await test('卷型 · 练习题只出一个大题、竞赛换成思维题', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('卷型', '练习题').click();
  await sleep(150);
  let p = await generate();
  let n = (p.text.match(/（每题 \d+ 分/g) ?? []).length;
  if (n !== 1) throw new Error(`练习题排了 ${n} 个大题，应该只有 1 个`);
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('卷型', '竞赛').click();
  await sleep(150);
  p = await generate();
  n = (p.text.match(/（每题 \d+ 分/g) ?? []).length;
  if (n < 3) throw new Error(`竞赛只排了 ${n} 个大题`);
  if (!/找规律|应用题|比大小|填括号/.test(p.text)) throw new Error('竞赛卷里没有一道思维题：' + p.text.slice(0, 120));
  return `练习题 1 个大题 · 竞赛 ${n} 个大题且含思维题`;
});

// 4 ---------------------------------------------------------------
await test('卷型 · 拼音自动切到语文，题全是字词拼音', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('卷型', '拼音').click();
  await sleep(200);
  const on = [...findField(q('#view'), '科目（可多选）').querySelectorAll('.chip.on')].map(T);
  if (on.join() !== '语文') throw new Error('点了拼音卷，科目还是：' + (on.join('、') || '空'));
  const p = await generate();
  if (!/看拼音写词语/.test(p.text)) throw new Error('拼音卷里没有「看拼音写词语」');
  if (/口算|竖式|脱式/.test(p.text)) throw new Error('拼音卷里混进了数学题');
  // 收尾：卷型退回全部、科目退回数学，后面的用例还要按默认来
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('卷型', '全部').click();
  await sleep(150);
  const chips = () => [...findField(q('#view'), '科目（可多选）').querySelectorAll('.chip')];
  chips().find((c) => T(c) === '数学').click();
  await sleep(180);
  const zh = chips().find((c) => T(c) === '语文' && c.classList.contains('on'));
  if (zh) { zh.click(); await sleep(180); }
  return '自动切语文 · 只有拼音字词题';
});

// 5 ---------------------------------------------------------------
await test('卷型 · 拼音只到六年级、小升初从五年级起', async () => {
  const gradeSel = () => findField(q('#view'), '年级').querySelector('select');
  setControl(gradeSel(), '3');
  await sleep(220);
  if (!viewChip('卷型', '小升初').disabled) throw new Error('三年级竟然能选「小升初」');
  setControl(gradeSel(), '7');
  await sleep(240);
  if (!viewChip('卷型', '拼音').disabled) throw new Error('七年级竟然能选「拼音」');
  setControl(gradeSel(), '6');
  await sleep(240);
  if (viewChip('卷型', '小升初').disabled) throw new Error('六年级选不了「小升初」');
  if (viewChip('卷型', '拼音').disabled) throw new Error('六年级选不了「拼音」');
  setControl(gradeSel(), '3');
  await sleep(240);
  return '三年级无小升初 · 七年级无拼音 · 六年级两个都能选';
});

// 5.5 -------------------------------------------------------------
await test('学前 · 只开数学语文，卷面没有乘除、卷头不重复', async () => {
  const gradeSel = () => findField(q('#view'), '年级').querySelector('select');
  const opts = [...gradeSel().options].map((o) => o.textContent.trim());
  if (!opts.includes('学前')) throw new Error('年级下拉里没有「学前」：' + opts.join('/'));
  setControl(gradeSel(), '0');
  await sleep(260);

  const chips = () => [...findField(q('#view'), '科目（可多选）').querySelectorAll('.chip')];
  const enabled = chips().filter((c) => !c.disabled).map(T);
  if (enabled.join() !== '数学,语文') throw new Error('学前能选的科目是：' + enabled.join('、'));

  const p = await generate();
  if (/学前 · 学前/.test(p.text)) throw new Error('卷头印成了「学前 · 学前」');
  if (!/学前/.test(p.text)) throw new Error('卷头没有「学前」：' + p.text.slice(0, 60));
  if (/×|÷/.test(p.text)) throw new Error('学前卷里出现了乘除');
  const total = Number((p.text.match(/共\s*(\d+)\s*题/) ?? [])[1] ?? 0);
  if (!total) throw new Error('卷头读不到题量：' + p.text.slice(0, 80));
  if (total > 24) throw new Error(`学前卷 ${total} 题，没折半（常规卷 30+）`);

  // 语文：拼音 / 注音 / 补全词语，不能一道题都出不来
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  chips().find((c) => T(c) === '语文').click();
  await sleep(200);
  chips().find((c) => T(c) === '数学' && c.classList.contains('on')).click();
  await sleep(240);
  const zh = await generate();
  if (!/拼音|注音|补全词语|补充完整/.test(zh.text)) throw new Error('学前语文卷没有字词题：' + zh.text.slice(0, 120));

  // 收尾：回到三年级数学
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  chips().find((c) => T(c) === '数学').click();
  await sleep(160);
  chips().find((c) => T(c) === '语文' && c.classList.contains('on')).click();
  await sleep(160);
  setControl(gradeSel(), '3');
  await sleep(240);
  return `学前数学 ${total} 题 · 只开数学语文 · 语文卷出得来`;
});

// 6 ---------------------------------------------------------------
let base = null;
await test('生成卷子 · 页数 / 姓名栏 / 页脚页码', async () => {
  base = await generate();
  if (!base.n) throw new Error('一页都没排出来');
  if (!/姓名|班级/.test(base.text)) throw new Error('卷头没有姓名栏');
  if (!/第\s*1\s*\/\s*\d+\s*页/.test(base.text)) throw new Error('页脚没有「第 1/N 页」');
  return `${base.desc}`;
});

// 3 ---------------------------------------------------------------
await test('页脚 · 默认印「学生名 · 每日一练」，不印版权说明', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页脚', '默认（学生名 · 每日一练）').click();
  await sleep(80);
  const r = await generate();
  // 用户点名：那张「题目由本程序生成，非官方教材配套」别默认印出来；
  // 但左下角要留一句能认出「这是谁的哪张卷」的话
  if (/非官方教材配套/.test(r.text)) throw new Error('默认页脚还印着版权说明');
  if (!/每日一练/.test(r.text)) throw new Error('默认页脚没印「每日一练」');
  if (!/第\s*1\s*\/\s*\d+\s*页/.test(r.text)) throw new Error('页脚连页码都没了');
  return '印「每日一练」· 无版权说明 · 页码仍在';
});

// 4 ---------------------------------------------------------------
await test('页脚 · 整条不印', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页脚', '整条不印').click();
  await sleep(80);
  const r = await generate();
  if (/第\s*1\s*\/\s*\d+\s*页/.test(r.text)) throw new Error('整条不印时页码还在');
  if (/第\s*1\s*\/\s*\d+\s*页/.test(r.text)) throw new Error('页码还在');
  return '文案与页码都没了';
});

await test('页脚 · 自定义文字', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页脚', '自定义').click();
  await sleep(120);
  setFieldInput(q('#view'), '页脚文字', '三班数学 · 每日一练');

  const r = await generate();
  if (!/三班数学/.test(r.text)) throw new Error('自定义页脚没印出来');
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页脚', '默认（学生名 · 每日一练）').click();
  return '印出「三班数学 · 每日一练」';
});

// 6 ---------------------------------------------------------------
await test('页数上限 2 页 · 自动缩字号压进去', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  // 先切到「练习题」：只有一个大题，页数好控制。
  // 默认「全部」铺四类题型、本来就 4 页，缩字号有 0.72 的下限，压不进 2 页 ——
  // 那是设计如此，不是 bug，拿它测「压进去」只会一直红。
  viewChip('卷型', '练习题').click();
  await sleep(120);
  viewChip('页数上限', '不限').click();
  await sleep(80);
  // 默认卷本来就 2 页，限 2 页什么也测不出来 —— 先把第一类题型加到刚过 3 页
  // （不能堆太多：缩字号有 0.72 的下限，塞不进去就会老实多印一页，那是设计如此）
  let free = null;
  let used = '';
  let picked = '';
  for (const n of ['40', '50', '60', '70', '80']) {
    // 设完回读一次：带虚拟时间的无头浏览器偶尔会在重渲染的间隙把设置吞掉
    for (let k = 0; k < 3; k++) {
      setControl(q('#view .type-item input.num'), n);
      await sleep(180);
      picked = /已选 (\d+) 题/.exec(T(q('#view .page-head p')))?.[1] ?? '0';
      if (Number(picked) >= Number(n)) break;
    }
    if (Number(picked) < Number(n)) throw new Error(`题量设不成 ${n}（页面显示 ${picked}）`);
    viewChip('页数上限', '不限').click();
    await sleep(60);
    free = await generate();
    used = n;
    if (free.n >= 3) break;
    goCreate();
    await waitFor(() => q('#view .create-actions'), '出卷页');
  }
  if (!free || free.n < 3) throw new Error(`题量加到 ${used}（已选 ${picked} 题）也没到 3 页，当前 ${free?.n} 页`);
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页数上限', '2 页').click();
  await sleep(80);
  const capped = await generate();
  const shrunk = /缩到\s*(\d+)%/.exec(capped.desc);
  if (capped.n > free.n) throw new Error(`限页反而从 ${free.n} 页变 ${capped.n} 页`);
  if (capped.n > 2 && !shrunk) throw new Error(`限 2 页排了 ${capped.n} 页，且没缩过字号`);
  // 缩字号可以，但题不能少
  const lf = free.text.replace(/\s/g, '').length;
  const lc = capped.text.replace(/\s/g, '').length;
  if (lc < lf * 0.9) throw new Error(`限页后内容少了 ${Math.round((1 - lc / lf) * 100)}%，可能丢题`);
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页数上限', '不限').click();
  viewChip('卷型', '全部').click();
  const reset = qa('#view .type-tools .btn').find((b) => T(b) === '全选常用');
  if (reset) reset.click();
  return `${used} 题：不限 ${free.n} 页 → 限 2 页 ${capped.n} 页${shrunk ? `（字号缩到 ${shrunk[1]}%）` : '（压不下去，按设计保留）'} · 题目没丢`;
});

// 7 ---------------------------------------------------------------
await test('横版 A4 · 纸面真的转成 842×595', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('页数上限', '不限').click();
  await sleep(80);
  viewChip('纸张', 'A4 横版').click();
  await sleep(80);
  const r = await generate();
  const w = parseFloat(r.pages[0].style.width);
  const h = parseFloat(r.pages[0].style.height);
  if (!(w > h)) throw new Error(`纸面还是 ${w}×${h}`);
  if (Math.round(w) !== 842 || Math.round(h) !== 595) throw new Error(`尺寸 ${w}×${h} 不是 A4 横版`);
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('纸张', 'A4 竖版').click();
  return `${Math.round(w)}×${Math.round(h)}pt`;
});

await test('自编题 · 算式模式（自动算答案）', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  const add = qa('#view .btn').find((b) => T(b) === '＋ 新建自编题');

  add.click();

  chipIn(modal(), '模式', '算式').click();
  await sleep(60);
  const ta = modal().querySelector('textarea');
  setControl(ta, '24+18\n7×8\n96÷4\n7÷2\n24+18');
  await sleep(120);
  const save = modalBtn('保存');
  save.click();
  await sleep(200);
  const item = q('#view .custom-item');
  if (!item) throw new Error('自编题没存下来');
  const desc = T(item);
  if (!/算式/.test(desc)) throw new Error('列表里没显示模式：' + desc);
  // 勾上它再出卷
  const box = item.querySelector('input[type=checkbox]');
  box.checked = true;
  box.dispatchEvent(new Event('change', { bubbles: true }));
  await sleep(120);
  const r = await generate();
  // 算式会被排成「24 + 18 = （　　）」，等号两边带空格，匹配时别写死
  if (!/24\s*\+\s*18/.test(r.text)) throw new Error('卷面没有自编的算式');
  // 答案页每个答案是一个独立的绝对定位块，textContent 会连成一串（18.4219.40…），
  // 所以按块取文本再判断，别在整页字符串上找数字
  const cells = r.pages.flatMap((p) => [...p.children].map((n) => T(n)));
  if (!cells.some((c) => /(^|\D)42$/.test(c))) {
    throw new Error('答案 42 没算出来｜尾部：' + cells.slice(-8).join(' / '));
  }
  return `${desc} · ${r.n} 页`;
});

await test('导出 PDF · 字节结构正确（页数、MediaBox、EOF）', async () => {
  const posts = D().defaultView.__papermill;
  const r = posts.result;
  if (!r?.pages?.length) throw new Error('没有可导出的卷子');
  const { buildPdfBlob } = await import('./js/ui/export.js');
  const blob = await buildPdfBlob(r.pages, { dpi: 120 });
  const buf = new Uint8Array(await blob.arrayBuffer());
  const text = new TextDecoder().decode(buf);
  if (!text.startsWith('%PDF-1.4')) throw new Error('PDF 头不对');
  if (!text.trimEnd().endsWith('%%EOF')) throw new Error('PDF 尾部没有 %%EOF');
  const pageObjs = (text.match(/\/Type \/Page[^s]/g) ?? []).length;
  if (pageObjs !== r.pageCount) throw new Error(`PDF 里 ${pageObjs} 页，卷子是 ${r.pageCount} 页`);
  if (!/\/MediaBox \[0 0 595 842\]/.test(text)) throw new Error('MediaBox 不是 A4 纵向');
  if (!/\/Filter \/DCTDecode/.test(text)) throw new Error('图片流没用 JPEG');
  return `${Math.round(blob.size / 1024)}KB · ${pageObjs} 页 · MediaBox A4`;
});

await test('编辑排版 · 点题改字、删题、滑杆重排', async () => {
  if (frame.clientWidth < 1024) return '窗口太窄，跳过（电脑端功能）';
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  const before = await generate();
  const qCount = () => D().defaultView.__papermill.paper.questions.length;
  const n0 = qCount();
  const editBtn = qa('#view .preview-toolbar .btn').find((b) => T(b).includes('编辑排版'));
  if (!editBtn) throw new Error('没有「编辑排版」按钮');
  editBtn.click();
  await waitFor(() => q('#view .edit-panel'), '编辑面板');
  await waitFor(() => qa('#view .hit').length > 0, '纸面热区', 8000);
  const hits = qa('#view .hit');
  if (hits.length < 3) throw new Error(`纸面热区只有 ${hits.length} 个`);

  // 快照整张卷的 slot 坐标：改字之后这些数字一个都不许变（「不破坏原布局」）
  const snap = () => D().defaultView.__papermill.result.pages
    .flatMap((p) => (p.hits ?? [])
      .map((h) => `${p.index}|${h.qid}|${h.x.toFixed(2)}|${h.y.toFixed(2)}|${h.w.toFixed(2)}`));
  const slot0 = snap();
  const pages0 = D().defaultView.__papermill.result.pages.length;

  hits[0].click();
  await sleep(250);
  const ta = q('#view .inline-ta');
  if (!ta) throw new Error('点题之后纸面上没有出现原地输入框');
  const oldText = ta.value;

  // 原地加长题干：纸面要出现新字，但**一个 slot 都不许挪**，页数也不许变
  setControl(ta, `${oldText}（这一句是手动加的，应该立刻出现在纸面上，而且不许把别的题推走）`);
  await sleep(300);
  ta.blur();                       // 输入期间不重画是设计：点走（或 ⌘↵）才落纸
  await sleep(600);
  const after = collect();
  if (!/手动加的/.test(after.text)) throw new Error('改完题干纸面没跟着变');
  const slot1 = snap();
  const moved = slot1.filter((x, i) => x !== slot0[i]);
  if (moved.length) throw new Error(`改一个字就挪了 ${moved.length} 处：${moved[0]}（原 ${slot0[slot1.indexOf(moved[0])]}）`);
  const pages1 = D().defaultView.__papermill.result.pages.length;
  if (pages1 !== pages0) throw new Error(`页数从 ${pages0} 变成 ${pages1}`);

  // 删一题：题数应当少 1
  const del = qa('#view .edit-panel .btn').find((b) => T(b) === '删除');
  if (!del) throw new Error('没有删除按钮');
  del.click();
  await sleep(600);
  const n1 = qCount();
  if (n1 !== n0 - 1) throw new Error(`删完后 ${n1} 题，原来 ${n0} 题`);

  // 拖字号滑杆：手动值必须真的生效（不能被「自动试排」改回去）
  const range = q('#view .edit-panel input[type="range"]');
  if (!range) throw new Error('没有字号滑杆');
  setControl(range, '130');
  await sleep(500);
  const ts = D().defaultView.__papermill.result.typeScale;
  if (Math.abs(ts - 1.3) > 0.01) throw new Error(`字号滑杆拖到 130% 后 typeScale=${ts}`);

  return `${n0} 题 → 原地改字 ${slot1.length} 个 slot 原封不动 → 删 1 题余 ${n1} 题 → 字号 ${Math.round(ts * 100)}%`;
});

/** 纸面左上第一列的 x（= 页边距）与最大正文字号 —— 排版参数最直接的两个证据 */
function metricsOf(r) {
  const nodes = [...r.pages[0].querySelectorAll('[data-q]')];
  if (!nodes.length) throw new Error('第一页上没有题');
  const left = Math.min(...nodes.map((n) => parseFloat(n.style.left) || 0));
  const font = Math.max(...nodes.map((n) => parseFloat(n.style.fontSize) || 0));
  return { left, font };
}

function pointCard() {

  if (!card) throw new Error('出卷页没有「知识点专项」卡片');

function pointChip(card, label) {
  const c = [...card.querySelectorAll('.chip')].find((x) => T(x) === label);
  if (!c) throw new Error(`知识点里没有「${label}」`);

}
/**
 * 纸面上的每道题。
 *
 * 一道题在 DOM 里是**两个**节点（题号一个、题干一个，都带 data-q），
 * 所以按 qid 去重才是题量 —— 直接数节点会翻倍（踩过）。
 */
function questionNodes() {
  const best = new Map();
  qa('#view .paper-stage [data-q]:not([data-a])').forEach((n) => {
    const id = n.dataset.q;
    if (!id) return;
    const cur = best.get(id);
    // 同一个 qid 有两个节点：一个是「1.」题号、一个是题干，取文字长的那个
    if (!cur || T(n).length > T(cur).length) best.set(id, n);
  });
  return [...best.values()];
}
/** 大题标题去重：答案页会把同一批标题再印一遍，不去重就会翻倍 */
function sectionHeads(text) {
  const set = new Set();
  String(text).replace(/\s+/g, ' ').split(/(?=[一二三四五六七八九十]、)/).forEach((x) => {
    const m = /^([一二三四五六七八九十]、[^（]+)（/.exec(x.trim());
    if (m) set.add(m[1]);
  });
  return [...set];
}

/**
 * 清空存档重开一次。
 *
 * 知识点用例要数「一共几道题」，而前面用例留下的自编题会原样接在专项大题后面
 * （这是设计如此：自编题永远追加），不清掉就会把 4 道自编题算进来。
 */
async function freshApp() {
  // 注意是 window.localStorage：document 上没有这个属性（踩过一次）
  frame.contentWindow.localStorage.removeItem(KEY);
  D().location.reload();
  await waitFor(() => q('#view .create-actions'), '出卷页重开', 15000);
  await sleep(500);
}

await test('知识点专项 · 15 个知识点都在，点「表内乘法」整张卷只出乘法', async () => {
  await freshApp();
  const card = pointCard();
  const chips = [...card.querySelectorAll('.chip')].map(T);
  const miss = POINT_NEED.filter((x) => !chips.includes(x));
  if (miss.length) throw new Error('缺知识点：' + miss.join('、'));

  pointChip(card, '表内乘法').click();
  await sleep(220);
  const p = await generate();
  if (!/表内乘法专项/.test(p.text)) throw new Error('卷头没印「表内乘法专项」：' + p.text.slice(0, 80));
  const qs = questionNodes();
  if (qs.length !== 20) throw new Error(`题量是 ${qs.length}，默认应该是 20`);
  const bad = qs.map(T).filter((t) => !/^\d+×\d+=（\s*）$/.test(t));
  if (bad.length) throw new Error(`混进了别的题：${bad.slice(0, 3).join(' / ')}`);
  // 口诀范围内的积：1~9 乘 1~9 最多 81
  const nums = qs.map((n) => {
    const m = /(\d+)×(\d+)/.exec(T(n));
    return Number(m[1]) * Number(m[2]);
  });
  if (nums.some((v) => v > 81)) throw new Error('出现了超出乘法口诀表的积');
  return `15 个知识点 · 20 题全是表内乘法 · 最大积 ${Math.max(...nums)}`;
});

await test('知识点专项 · 勾两个知识点 = 两道大题，清空后回到题型配比', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  const card = pointCard();
  // 上一条用例已经勾了表内乘法，这里再补一个表内除法
  pointChip(card, '表内除法').click();
  await sleep(220);
  const p = await generate();
  const heads = sectionHeads(p.text);
  if (heads.length !== 2) throw new Error(`排了 ${heads.length} 个大题：${heads.join(' / ')}`);

  if (!/表内乘法/.test(p.text) || !/表内除法/.test(p.text)) throw new Error('两个大题名没有都印出来');
  const qs = questionNodes();
  if (qs.length !== 40) throw new Error(`总题量是 ${qs.length}，两个知识点各 20 应该是 40`);
  const div = qs.map(T).filter((t) => /÷/.test(t)).length;
  if (div !== 20) throw new Error(`除法题有 ${div} 道，应该是 20 道`);

  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  const back = [...pointCard().querySelectorAll('.btn')].find((b) => T(b) === '清空知识点');
  if (!back) throw new Error('没有「清空知识点」按钮');
  back.click();
  await sleep(220);
  const typeCount = qa('#view .type-item').length;
  if (!typeCount) throw new Error('清空后题型配比没回来');
  const again = await generate();
  if (/专项/.test(again.text)) throw new Error('清空后卷头还写着专项');
  return `2 个大题 40 题（含 20 道除法）· 清空后 ${typeCount} 个题型回来`;
});

await test('知识点专项 · 四~六年级 17 个新知识点都在，「圆的周长」出卷把 π 说明提到标题行', async () => {
  await freshApp();
  const card = pointCard();
  const chips = [...card.querySelectorAll('.chip')].map(T);
  const want = [
    '三位数乘两位数', '除数是两位数的除法', '一位小数加减法', '整数四则混合运算', '万以上数的比较',
    '小数乘整数', '小数除以整数', '最大公因数与最小公倍数', '约分', '异分母分数加减',
    '平行四边形三角形梯形面积', '长方体正方体体积', '解简易方程',
    '分数乘法', '分数除法', '求一个数的百分之几', '圆的周长与面积',
  ];
  const miss = want.filter((x) => !chips.includes(x));
  if (miss.length) throw new Error('缺知识点：' + miss.join('、'));

  // 15 个是搬的、17 个是新补的，一共 32 个（题量 chip 形如「20 题」，不算知识点）
  const pointChips = chips.filter((x) => !/^\d+ 题$/.test(x));
  if (pointChips.length !== 32) throw new Error(`知识点有 ${pointChips.length} 个，应该是 32 个`);

  pointChip(card, '圆的周长与面积').click();
  await sleep(220);
  const p = await generate();
  if (!/圆的周长与面积专项/.test(p.text)) throw new Error('卷头没印专项名：' + p.text.slice(0, 60));

  const qs = questionNodes().map(T);
  if (!qs.length) throw new Error('一道题都没出来');
  const noCircle = qs.filter((t) => !t.includes('圆'));
  if (noCircle.length) throw new Error(`混进了别的题：${noCircle.slice(0, 2).join(' / ')}`);
  // 「π 取 3.14」要出现在标题行，题干里不能再逐题重复（重复会把两栏宽的题干挤到折行）
  if (!/π 取 3.14/.test(p.text)) throw new Error('标题行没有「π 取 3.14」');
  if (qs.some((t) => t.includes('π 取 3.14'))) throw new Error('题干里还逐题印着「π 取 3.14」');
  // 题干在 SVG 里被折行切成好几个 text 节点，逐题拼整句不可靠；
  // 改看整页文字：问句和单位都得在，且不能混进别的题型
  if (!/是多少(厘米|平方厘米)/.test(p.text)) {
    throw new Error('纸面上没有「是多少厘米 / 平方厘米」的问句');
  }
  if (!/(周长|面积)/.test(p.text)) throw new Error('题干里既没问周长也没问面积');
  return `32 个知识点 · 圆的专项 ${qs.length} 题 · π 说明只在标题行印一次`;
});

// ---------------------------------------------------------------- 真题库

function examCard() {
  const card = qa('#view .card').find((c) => T(c.querySelector('h2')).startsWith('真题库'));
  if (!card) throw new Error('出卷页没有「真题库」卡片');
  return card;
}

/** 真题库是懒加载的：卡片先出现，题库读完才把「正在读取」换掉 */
async function examReady() {
  await waitFor(() => {
    const c = qa('#view .card').find((x) => T(x.querySelector('h2')).startsWith('真题库'));
    return c && !/正在读取/.test(T(c));
  }, '真题库载入', 20000);
  return examCard();
}

await test('真题库 · 开真题后整卷都是真题，勾几类就排几个大题', async () => {
  await freshApp();
  // 默认卷是三年级数学，而真题库里三年级数学一道都没有 —— 先把年级切到有题的六年级
  const sel = [...D().querySelectorAll('#view select')]
    .find((x) => [...x.options].some((o) => T(o).includes('六年级')));
  if (!sel) throw new Error('找不到年级下拉');
  sel.value = '6';
  sel.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
  await sleep(500);

  const card = await examReady();
  const n = Number((/真题库（(\d+) 道）/.exec(T(card.querySelector('h2'))) || [])[1] || 0);
  if (!n) throw new Error('真题库读出来是空的');

  const btn = [...card.querySelectorAll('button')].find((b) => T(b) === '用真题出卷');
  if (!btn) throw new Error('没有「用真题出卷」按钮');
  btn.click();
  await sleep(400);

  const p = await generate();
  // 默认勾选的大类数量从卡片上的 chip 现数，别在测试里写死 —— 以后加类别不用改这里
  const famLabels = [...card.querySelectorAll('.chip')]
    .map((c) => T(c)).filter((t) => /^(填空|选择|判断|应用|计算|其他)/.test(t))
    .map((t) => t.replace(/\s*\d+$/, ''));
  const picked = [...card.querySelectorAll('.chip.on')]
    .map((c) => T(c).replace(/\s*\d+$/, ''))
    .filter((t) => famLabels.includes(t));
  if (picked.length < 4) throw new Error(`勾中的类别只有 ${picked.length} 个`);
  const heads = sectionHeads(p.text);
  if (!heads.length) throw new Error('一道大题都没排出来');
  // 真题一个大类排一个大题，且题库里没题的类别会被跳过，所以只能比「不超过」
  if (heads.length > picked.length) throw new Error(`排了 ${heads.length} 个大题（${heads.join(' / ')}），勾了 ${picked.length} 类（${picked.join(' / ')}）`);
  const qs = questionNodes();
  if (!qs.length) throw new Error('卷面没有题');
  if (qs.length > picked.length * 5) {
    throw new Error(`题数是 ${qs.length}，${picked.length} 类各 5 题最多 ${picked.length * 5}`);
  }
  // 真题大题名就是类别名，不该出现生成器那套名字（口算天天练之类）
  const bad = heads.filter((h) => !picked.some((lb) => h.includes(lb)));
  if (bad.length) throw new Error('大题名不对：' + bad.join(' / '));

  return `库里 ${n} 道 · 勾 ${picked.length} 类 · 排了 ${heads.length} 个大题 ${qs.length} 题`;
});

await test('真题库 · 「其他题」默认不勾，勾上就多出一个大题', async () => {
  // 上一条已经在真题模式里了，这里直接补勾「其他题」再出一张
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  const card2 = examCard();
  const other = [...card2.querySelectorAll('.chip')].find((c) => /^其他题/.test(T(c)));
  if (!other) throw new Error('没有「其他题」chip');
  if (other.disabled) throw new Error('这个年级的「其他题」是 0 道，池子不该为空');
  if (other.classList.contains('on')) throw new Error('「其他题」应该默认不勾，留给用户自己选');
  other.click();
  await sleep(300);

  const p = await generate();
  const heads = sectionHeads(p.text);
  if (!heads.some((h) => h.includes('其他'))) throw new Error('勾了其他题，卷面却没有其他题大题');
  return `补勾其他题 · ${heads.length} 个大题 · 大题名 ${heads.join(' / ')}`;
});

// ---------------------------------------------------------------- 末页补满 / 错题优先

await test('末页补满 · 开了以后末页不再是半张纸，页数不增', async () => {
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  // 上一条用例把页数上限设成了 2 页，这里必须先还原 —— 限页时不补满（两个开关会打架）
  viewChip('页数上限', '不限').click();
  await sleep(80);
  // 用「练习题」卷型（只出一个大题）把整卷压到半张纸 —— 这样末页一定空着
  viewChip('卷型', '练习题').click();
  await sleep(120);
  viewChip('末页补满', '严格按题量').click();
  await sleep(80);
  const num = q('#view .type-item input.num');
  if (!num) throw new Error('出卷页没有题型题量输入框');
  setControl(num, '3');
  await sleep(200);
  const off = await generate();

  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('末页补满', '自动补满').click();
  await sleep(150);
  if (!viewChip('末页补满', '自动补满').classList.contains('on')) throw new Error('「自动补满」没选中');
  const on = await generate();

  const lenOff = off.text.replace(/\s/g, '').length;
  const lenOn = on.text.replace(/\s/g, '').length;
  if (lenOn <= lenOff) throw new Error(`开了补满卷面没变多（${lenOff} → ${lenOn} 字），末页本来就满？`);
  if (on.n > off.n) throw new Error(`补满多印了一页（${off.n} → ${on.n} 页）`);

  // 收尾：把这个开关拨回出厂值，后面的用例按「严格按题量」跑
  goCreate();
  await waitFor(() => q('#view .create-actions'), '出卷页');
  viewChip('末页补满', '严格按题量').click();
  await sleep(80);
  return `${off.n} 页 ${lenOff} 字 → ${on.n} 页 ${lenOn} 字`;
});

await test('错题优先 · 真题卷里错过的题会被优先抽回来', async () => {
  await freshApp();
  // 真题库里三年级数学一道都没有，先切到六年级
  const sel = [...D().querySelectorAll('#view select')]
    .find((x) => [...x.options].some((o) => T(o).includes('六年级')));
  if (!sel) throw new Error('找不到年级下拉');
  sel.value = '6';
  sel.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
  await sleep(500);
  const card = await examReady();
  const open = [...card.querySelectorAll('button')].find((b) => T(b) === '用真题出卷');
  if (!open) throw new Error('没有「用真题出卷」按钮');
  open.click();
  await sleep(400);
  await generate();

  // 记两道错题，顺手记下它们的题干片段
  const btn = qa('#view .preview-toolbar .btn').find((b) => T(b) === '批改');
  if (!btn) throw new Error('工具栏没有「批改」');
  btn.click();
  await waitFor(() => modal(), '批改弹窗');
  const rows = [...modal().querySelectorAll('.grading-row')];
  if (rows.length < 4) throw new Error(`批改列表只有 ${rows.length} 道`);
  const snippets = rows.slice(0, 2).map((r) => T(r.querySelector('b')).replace(/^\d+[.、]\s*/, '').replace(/\s/g, '').slice(0, 10));
  rows.slice(0, 2).forEach((r) => {
    const b = r.querySelector('input');
    b.checked = true;
    b.dispatchEvent(new Event('change', { bubbles: true }));
  });
  modalBtn('记进错题本').click();
  await sleep(300);

  // 从错题本页读一遍真实存下来的题干（比弹窗里猜可靠）
  dock('错题本');
  await waitFor(() => q('#view .mistake-list'), '错题本页');
  const saved = qa('#view .mistake-item')
    .slice(0, 2)
    .map((x) => T(x).replace(/\s/g, '').slice(0, 10))
    .filter(Boolean);
  if (saved.length < 2) throw new Error(`错题本里只存下 ${saved.length} 道`);

  dock('出卷');
  await waitFor(() => q('#view .create-actions'), '出卷页');
  const next = await generate();
  const flat = next.text.replace(/\s/g, '');
  const hit = saved.filter((s) => flat.includes(s));
  if (!hit.length) throw new Error(`新卷里一道错题都没抽回来（错题：${saved.join(' / ')}）`);
  return `记 2 道错题 → 新卷抽回 ${hit.length} 道`;
});
